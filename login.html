
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #243b55;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        .extra {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .extra a {
            color: #243b55;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Login</h2>

        <form>
            <label for="username">Username</label>
            <input type="text" id="username"
                   placeholder="Enter your username" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>

        <div class="extra">
            <p>Don't have an account?
                <a href="#">Sign Up</a>
            </p>
        </div>
    </div>

</body>
</html>
